services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lifepilot
      POSTGRES_USER: lifepilot
      POSTGRES_PASSWORD: lifepilot
    ports:
      - "5432:5432"
    volumes:
      - lifepilot-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  lifepilot-postgres:
