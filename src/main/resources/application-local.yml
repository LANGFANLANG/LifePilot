spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/lifepilot
    username: lifepilot
    password: lifepilot
  jpa:
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6380
  ai:
    openai:
      api-key: ${DEEPSEEK_V4:${OPENAI_API_KEY:}}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}

lifepilot:
  security:
    auth-enabled: false
    jwt-secret: ${LIFEPILOT_JWT_SECRET:change-me-change-me-change-me-change-me}

mybatis-plus:
  type-handlers-package: com.lifepilot.config
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      update-strategy: always
